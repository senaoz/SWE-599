services:
  db:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_DB: swe599
      POSTGRES_USER: swe599
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swe599 -d swe599"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://swe599:${DB_PASSWORD}@db:5432/swe599
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      EMBED_URL: http://embedder:8080/v1
      OPENALEX_EMAIL: ${OPENALEX_EMAIL:-}
    volumes:
      - ./research/data:/app/research/data
    depends_on:
      db:
        condition: service_healthy
      embedder:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Qwen3-Embedding-8B Q4_K_M on llama.cpp's server, with the research settings (D2; research/README.md).
  # The GGUF (about 4.4 GB) is downloaded from Hugging Face on first start into the llama_cache volume.
  # Needs enough RAM for the 8B model; see docs/MATCHING_DESIGN.md, open question O1.
  embedder:
    image: ghcr.io/ggml-org/llama.cpp:server-b11146
    restart: always
    command: >
      --hf-repo Qwen/Qwen3-Embedding-8B-GGUF --hf-file Qwen3-Embedding-8B-Q4_K_M.gguf
      --alias Qwen/Qwen3-Embedding-8B-Q4_K_M
      --embeddings --pooling last --ctx-size 0 --batch-size 2048 --ubatch-size 2048
      --host 0.0.0.0 --port 8080
    volumes:
      - llama_cache:/root/.cache/llama.cpp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: always
    depends_on:
      - backend

volumes:
  postgres_data:
  llama_cache:
