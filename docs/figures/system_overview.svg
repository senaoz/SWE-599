  <!-- Row 3: data source and local models -->
  <text class="mod lab" x="120" y="380">3 · data and local models (no cloud)</text>
  <rect class="box" x="40" y="390" width="264" height="80" rx="8"/>
  <rect class="mod" x="40" y="390" width="4" height="80" rx="2"/>
