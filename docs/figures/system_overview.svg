  <text class="muted t" x="336" y="432">Llama 3.2 3B Instruct Q4_K_M · ctx 16k</text>
  <text class="muted t" x="336" y="448">Qwen3-Embedding-8B Q4_K_M</text>
  <text class="muted t" x="336" y="464">last-token pooling (verified)</text>

  <rect class="box" x="600" y="390" width="264" height="80" rx="8"/>
  <rect class="mod" x="600" y="390" width="4" height="80" rx="2"/>
