    <text class="muted t" x="400" y="608">7 methods + probes</text>
    <text class="muted t" x="400" y="624">recall@k up to 100</text>
  </g>
  <line class="line" x1="546" y1="588" x2="558" y2="588" marker-end="url(#arrow)"/>
  <g>
    <rect class="box" x="562" y="532" width="158" height="112" rx="8"/>
    <rect class="v2" x="562" y="532" width="158" height="4" rx="2"/>
    <text class="v2 num" x="574" y="554">10</text>
    <text class="ink h" x="596" y="554">Expansion</text>
    <text class="muted t" x="574" y="576">GRIT-style: top 5 seed,</text>
    <text class="muted t" x="574" y="592">bottom 10% replaced</text>
    <text class="muted t" x="574" y="608">random / kNN / LADR</text>
    <text class="muted t" x="574" y="624">ablations + canary</text>
  </g>

  <rect class="box" x="742" y="508" width="418" height="166" rx="8"/>
  <rect class="v2" x="742" y="508" width="4" height="166" rx="2"/>
  <text class="ink h" x="760" y="530">Phase 5 results (test, recall@100)</text>
  <text class="ink t" x="760" y="552">Qwen3, full corpus</text>
  <text class="ink t" x="1146" y="552" text-anchor="end">64.0% (BM25 38.7%)</text>
  <text class="ink t" x="760" y="570">+ co-citation expansion, all rules</text>
  <text class="ink t" x="1146" y="570" text-anchor="end">+0.8 [−0.4, +2.1], n.s.</text>
  <text class="ink t" x="760" y="588">random graph · kNN graph</text>
  <text class="ink t" x="1146" y="588" text-anchor="end">−0.8 · +0.3</text>
  <text class="v1 t" x="760" y="606">canary (query's own references added)</text>
  <text class="v1 t" x="1146" y="606" text-anchor="end">+5.8 [+3.6, +8.2]</text>
  <text class="ink t" x="760" y="624">second stage, nDCG@10</text>
  <text class="ink t" x="1146" y="624" text-anchor="end">Llama −0.164 · Qwen3-Reranker +0.021</text>
  <text class="muted t" x="760" y="644">Positives reachable through the graph: 54.7% (62.9% with raw dates)</text>
  <text class="muted t" x="760" y="662">Leaks caught: a 2012 copy with 10/10 refs; 24% year-only dates</text>

