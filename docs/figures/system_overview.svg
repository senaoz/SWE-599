    <rect class="v2" x="40" y="236" width="124" height="4" rx="2"/>
    <text class="v2 num" x="52" y="258">01</text>
    <text class="ink h" x="74" y="258">Fetch</text>
    <text class="muted t" x="52" y="280">OpenAlex by id</text>
    <text class="muted t" x="52" y="296">one normalizer</text>
    <text class="muted t" x="52" y="312">ids asserted</text>
  </g>
  <line class="line" x1="164" y1="283" x2="176" y2="283" marker-end="url(#arrow)"/>
