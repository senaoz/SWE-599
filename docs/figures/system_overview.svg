<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">SWE-599 system overview</title>
  <desc id="d">The v1 benchmark was audited (nine problems) and rebuilt as a leak-free v2 pipeline of six notebooks running only local models. Embedding models lead; listwise Llama ranks last and follows candidate order. Phase 5 ranks each query against a 11,967-work corpus with a leakage-controlled co-citation graph: Qwen3 recall@100 is 64.0%, and graph expansion adds +0.8 points (not significant) while a canary adds +5.8. The deployed app uses BOUN data and a pointwise LLM stage that is not yet benchmarked.</desc>
  <style>
    .bg { fill: #fcfcfb; }
    .box { fill: #ffffff; stroke: #d9d7cf; stroke-width: 1; }
    .lane { fill: none; stroke: #c9c7bf; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .ink { fill: #1f1f1e; }
    .muted { fill: #5f5e5a; }
    .title { font-size: 20px; font-weight: 650; }
    .sub { font-size: 13px; }
    .h { font-size: 13.5px; font-weight: 650; }
    .t { font-size: 11.5px; }
    .lab { font-size: 11px; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; }
    .num { font-size: 12px; font-weight: 700; }
    .line { stroke: #8c8a83; stroke-width: 1.4; fill: none; }
    .dash { stroke: #8c8a83; stroke-width: 1.3; fill: none; stroke-dasharray: 4 4; }
    .head { fill: #8c8a83; }
    .v1 { fill: #eb6834; }  .v1s { stroke: #eb6834; }
    .v2 { fill: #2a78d6; }  .v2s { stroke: #2a78d6; }
    .mod { fill: #1baf7a; } .mods { stroke: #1baf7a; }
    .app { fill: #c98500; } .apps { stroke: #c98500; }
    .barbg { fill: #ecebe6; }
    .chance { stroke: #5f5e5a; stroke-width: 1; stroke-dasharray: 3 3; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1a19; }
      .box { fill: #232322; stroke: #3f3e3a; }
      .lane { stroke: #4a4944; }
      .ink { fill: #f3f2ed; }
      .muted { fill: #b6b4ab; }
      .line, .dash { stroke: #8f8d85; }
      .head { fill: #8f8d85; }
      .v1 { fill: #f07a4c; } .v1s { stroke: #f07a4c; }
      .v2 { fill: #4a8fe6; } .v2s { stroke: #4a8fe6; }
      .mod { fill: #2cc28c; } .mods { stroke: #2cc28c; }
      .app { fill: #e0a21f; } .apps { stroke: #e0a21f; }
      .barbg { fill: #33322f; }
      .chance { stroke: #b6b4ab; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="900" rx="14"/>

  <!-- Title -->
  <text class="ink title" x="40" y="38">SWE-599: audit of v1, a leak-free v2 benchmark, and leakage-controlled graph expansion</text>
  <text class="muted sub" x="40" y="58">Does reranking with a small local LLM help citation-based paper recommendation? Short answer: no.</text>

  <!-- Row 1: v1 and audit -->
  <text class="v1 lab" x="40" y="90">1 · v1 (May 2026) and audit</text>
  <rect class="box" x="40" y="100" width="250" height="92" rx="8"/>
  <rect class="v1" x="40" y="100" width="4" height="92" rx="2"/>
  <text class="ink h" x="56" y="124">v1 benchmark</text>
  <text class="muted t" x="56" y="144">Llama 3.2 3B listwise MRR 0.84</text>
  <text class="muted t" x="56" y="160">vs Qwen3 embeddings 0.51</text>
  <text class="muted t" x="56" y="178">→ "LLM wins" (tag v1-results)</text>

  <line class="line" x1="290" y1="146" x2="326" y2="146" marker-end="url(#arrow)"/>

  <rect class="box" x="330" y="100" width="534" height="92" rx="8"/>
  <rect class="v1" x="330" y="100" width="4" height="92" rx="2"/>
  <text class="ink h" x="346" y="124">Audit: 9 problems (F1–F9) → the v1 headline was an artifact</text>
  <text class="muted t" x="346" y="144">positives shown first · prompt example hinted a positive · fallback to input order</text>
  <text class="muted t" x="346" y="160">negatives lacked concepts · positives carried other papers' text (index bug)</text>
  <text class="muted t" x="346" y="178">nDCG mis-normalized · salted hash() seeds · SPECTER2 wrong pooling</text>

  <path class="line" d="M 700 192 L 700 232" marker-end="url(#arrow)"/>
  <text class="muted t" x="710" y="218">rebuilt as v2</text>

  <!-- Row 2: v2 pipeline -->
  <text class="v2 lab" x="40" y="226">2 · v2 pipeline (research/v2/, numbered notebooks)</text>

