  <text class="muted t" x="616" y="432">MiniLM · SPECTER2 [CLS] · bge-reranker</text>
  <text class="muted t" x="616" y="448">EmbeddingGemma with Dense layers</text>
  <text class="muted t" x="616" y="464">BM25 · TF-IDF (no model)</text>

