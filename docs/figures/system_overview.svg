    <text class="muted t" x="226" y="592">duplicates, later or</text>
    <text class="muted t" x="226" y="608">query citers; safe dates</text>
    <text class="muted t" x="226" y="624">unit test per rule</text>
  </g>
  <line class="line" x1="372" y1="588" x2="384" y2="588" marker-end="url(#arrow)"/>
  <g>
    <rect class="box" x="388" y="532" width="158" height="112" rx="8"/>
