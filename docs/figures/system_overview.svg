  <!-- Right column: results -->
  <rect class="box" x="896" y="100" width="264" height="370" rx="8"/>
  <rect class="v2" x="896" y="100" width="4" height="370" rx="2"/>
  <text class="ink h" x="914" y="124">v2 test results</text>
  <text class="muted t" x="914" y="142">R-precision %, random / concept</text>

  <g class="t">
    <text class="ink t" x="914" y="168">Qwen3-Embedding-8B</text>
    <text class="ink t" x="1146" y="168" text-anchor="end">87.0 / 80.1</text>
    <rect class="barbg" x="914" y="174" width="232" height="6" rx="3"/>
    <rect class="mod" x="914" y="174" width="201.8" height="6" rx="3"/>

    <text class="ink t" x="914" y="198">MiniLM (22M params)</text>
    <text class="ink t" x="1146" y="198" text-anchor="end">83.3 / 75.7</text>
    <rect class="barbg" x="914" y="204" width="232" height="6" rx="3"/>
    <rect class="mod" x="914" y="204" width="193.3" height="6" rx="3"/>

    <text class="ink t" x="914" y="228">Llama pointwise</text>
    <text class="ink t" x="1146" y="228" text-anchor="end">78.8 / 73.9</text>
    <rect class="barbg" x="914" y="234" width="232" height="6" rx="3"/>
    <rect class="app" x="914" y="234" width="182.8" height="6" rx="3"/>

    <text class="ink t" x="914" y="258">Qwen3 → Llama (k = 10)</text>
    <text class="ink t" x="1146" y="258" text-anchor="end">74.0 / 69.7</text>
    <rect class="barbg" x="914" y="264" width="232" height="6" rx="3"/>
    <rect class="app" x="914" y="264" width="171.7" height="6" rx="3"/>

    <text class="ink t" x="914" y="288">Llama listwise (v1 "winner")</text>
    <text class="ink t" x="1146" y="288" text-anchor="end">43.9 / 42.0</text>
    <rect class="barbg" x="914" y="294" width="232" height="6" rx="3"/>
    <rect class="v1" x="914" y="294" width="101.8" height="6" rx="3"/>

    <line class="chance" x1="991.3" y1="160" x2="991.3" y2="304"/>
    <text class="muted t" x="995" y="318">chance 33.3 (bars: random)</text>
  </g>

  <line class="box" x1="914" y1="334" x2="1146" y2="334" style="stroke-width:1"/>
  <text class="ink h" x="914" y="356">Why listwise fails</text>
  <text class="muted t" x="914" y="376">Same candidates, only order changed:</text>
  <text class="ink t" x="914" y="394">positives first → MRR 0.95 / 0.98</text>
  <text class="ink t" x="914" y="410">positives last → MRR 0.33 / 0.27</text>
  <text class="muted t" x="914" y="430">51% of outputs copy the input list</text>
  <text class="muted t" x="914" y="446">(median Spearman ρ = 0.98)</text>
  <text class="muted t" x="914" y="462">Llama reranking: −13 / −10 points</text>

  <!-- Row 4: Phase 5 -->
  <text class="v2 lab" x="40" y="520">4 · Phase 5 (Oct 2026): full corpus, leakage-controlled graph, reranking (notebooks 07–12)</text>
  <g>
