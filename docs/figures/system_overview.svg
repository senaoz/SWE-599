    <text class="muted t" x="472" y="280">13 methods</text>
    <text class="muted t" x="472" y="296">shuffled · 5 seeds</text>
    <text class="muted t" x="472" y="312">order conditions</text>
  </g>
  <line class="line" x1="584" y1="283" x2="596" y2="283" marker-end="url(#arrow)"/>
