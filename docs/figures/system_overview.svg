    <text class="muted t" x="52" y="576">title search per query,</text>
    <text class="muted t" x="52" y="592">before the query only</text>
    <text class="muted t" x="52" y="608">13,572 citers</text>
    <text class="muted t" x="52" y="624">11,967-work corpus</text>
  </g>
