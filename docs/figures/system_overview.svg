  <text class="muted t" x="56" y="432">174 query papers · 1,729 references</text>
  <text class="muted t" x="56" y="448">155 references deleted (404)</text>
  <text class="muted t" x="56" y="464">~6% "abstracts" are not abstracts</text>
  <path class="line" d="M 102 390 L 102 334" marker-end="url(#arrow)"/>

  <rect class="box" x="320" y="390" width="264" height="80" rx="8"/>
